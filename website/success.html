<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Successful — Filli AI Unlimited Pro</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4f46e5;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 48px;
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.04);
    }
    .icon-wrap {
      width: 72px;
      height: 72px;
      background: #ecfdf5;
      color: #059669;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 28px;
      font-weight: 900;
      color: var(--text);
      margin-bottom: 12px;
      letter-spacing: -0.02em;
    }
    p {
      color: var(--muted);
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .badge {
      display: inline-block;
      padding: 6px 16px;
      background: #eef2ff;
      color: var(--primary);
      border-radius: 999px;
      font-weight: 700;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 20px;
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 14px 24px;
      background: var(--primary);
      color: #fff;
      font-weight: 700;
      font-size: 15px;
      border-radius: 12px;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #4338ca;
    }
    .subtext {
      margin-top: 20px;
      font-size: 13px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap">✓</div>
    <div class="badge">Pro Subscription Active</div>
    <h1>You're officially on Pro!</h1>
    <p>Your payment was verified successfully. You now have unlimited AI form filling, custom domain memory, and priority speed.</p>
    <a href="javascript:window.close()" class="btn">Close Tab & Return to Extension</a>
    <div class="subtext">You can refresh your extension options page to see your Pro tier immediately.</div>
  </div>
</body>
</html>
